title = "Home"
base_url = "https://mikebelanger.ca"
[plugins]
processors = ["markdown"]

[content.files]
allow_extensions = ["jpg", "jpeg", "png", "gif", "svg", "webp"]

[highlight]
enabled = true
mode = "server"
theme = "github"
use_cdn = false
copy = true

[[taxonomies]]
name = "tags"
feed = true

[[taxonomies]]
name = "categories"

[[taxonomies]]
name = "authors"

[sitemap]
enabled = true

[feeds]
enabled = true
type = "rss"
limit = 10
sections = ["posts"]

[search]
enabled = true
format = "fuse_json"
fields = ["title", "content", "description", "tags", "url", "section"]
filename = "search.json"
exclude = ["/private", "/drafts"]

[[menus.main]]
name = "Blog"
url = "/blog/"
weight = 1

# =============================================================================
# OpenGraph & Twitter Cards (recommended for social sharing)
# =============================================================================

[og]
type = "article"
twitter_card = "summary_large_image"

# =============================================================================
# Markdown (commonly customized)
# =============================================================================

[markdown]
emoji = true
task_lists = true
definition_lists = true
footnotes = true
mermaid = false        # Render ```mermaid code blocks as diagrams (loads mermaid.js)
math = false           # Inline ($...$) and block ($$...$$) math (loads math_engine)
math_engine = "katex"  # "katex" or "mathjax"

[deployment]
target = "prod"
source_dir = "public"
confirm = false
